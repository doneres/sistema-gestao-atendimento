services:
  db:
    image: postgres:16-alpine
    container_name: atendimento-postgres-db
    environment:
      POSTGRES_USER: sysadminatend
      POSTGRES_PASSWORD: +Y[p0kU*Z4jj
      POSTGRES_DB: atendimento_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysadminatend -d atendimento_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    container_name: atendimento-spring-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/atendimento_db
      SPRING_DATASOURCE_USERNAME: sysadminatend
      SPRING_DATASOURCE_PASSWORD: +Y[p0kU*Z4jj
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: atendimento-react-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
          - REACT_APP_API_URL=http://backend:8080/api
    ports:
      - "5371:80"
    depends_on:
      - backend
    restart: unless-stopped

  ia-service:
    container_name: atendimento-ia-service
    build:
      context: ./ia-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local