###############################################
# Ambiente padrao: Desenvolvimento local      #
# Banco roda em um container Docker acessivel #
# pela porta 5432 na maquina host.            #
###############################################

# =======================
# Application Config
# =======================
spring.application.name=atendimento

# =======================
# Database Configuration (LOCAL DEV)
# =======================
spring.datasource.url=jdbc:postgresql://localhost:5432/atendimento_db
spring.datasource.username=sysadminatend
spring.datasource.password=+Y[p0kU*Z4jj
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =======================
# CORS Configuration
# =======================
# Desenvolvimento: multiplas portas locais
cors.allowed-origins=http://localhost:5371,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5371

# Em producao, trocar por:
# cors.allowed-origins=https://seudominio.com,https://www.seudominio.com

# =======================
# Server Configuration
# =======================
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# =======================
# Logging
# =======================
logging.level.root=INFO
logging.level.br.com.djrx.atendimento=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# =======================
# JWT Configuration
# =======================
# Secret key para assinatura do JWT (MUDAR EM PRODUCAO!)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Tempo de expiracao do token em milissegundos (24 horas = 86400000ms)
jwt.expiration=86400000

# =======================
# SpringDoc OpenAPI (Swagger)
# =======================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
