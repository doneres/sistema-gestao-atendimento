# backend/src/main/resources/application-docker.properties

# =======================
# Application Config
# =======================
spring.application.name=atendimento

# =======================
# Database Configuration (DOCKER)
# =======================
spring.datasource.url=jdbc:postgresql://db:5432/atendimento_db
spring.datasource.username=sysadminatend
spring.datasource.password=+Y[p0kU*Z4jj
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =======================
# CORS Configuration
# =======================
# ✅ Para Docker, pode usar wildcard ou domínios específicos
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://localhost:5371

# =======================
# Server Configuration
# =======================
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# =======================
# Logging
# =======================
logging.level.root=INFO
logging.level.br.com.djrx.atendimento=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n