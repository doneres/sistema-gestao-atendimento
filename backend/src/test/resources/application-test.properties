spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Usar H2 e deixar o Hibernate cuidar do schema dos testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desabilitar open-in-view nos testes (boa prática)
spring.jpa.open-in-view=false

# JWT de teste
jwt.secret=secret-chave-de-teste-muito-segura-para-integration-tests-1234567890
jwt.expiration=3600000

# Logging mais silencioso nos testes
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
